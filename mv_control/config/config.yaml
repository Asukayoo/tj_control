# mv_control 运行配置
# 关节角 home_q / work_q 单位：度（与 Marvin SDK 一致）
# cart_state / MovL / ServoP：Link_Base 系（KDL FK/IK 直接输出）
# 关节限制：max_v/max_a/max_j 单位 deg/s、deg/s²、deg/s³（内部转为 rad）
# 笛卡尔限制：线速度 mm/s；角速度 deg/s、deg/s²、deg/s³（内部转为 rad）
# Servo：内部 kStreamServoCycles 周期三次样条（固定 40ms）；外部调用频率由应用层决定（如 test_servo 50Hz）

servo:
  servoj:
    p_gain: 500.0
    d_gain: 50.0
  servop:
    p_gain: 200.0
    d_gain: 50.0

connect:
  # 控制器 IP，对应 Connect(ip1, ip2, ip3, ip4)
  ip: [192, 168, 1, 190]
  log_switch: 0
  vel_ratio: 100
  acc_ratio: 100
  # mode_transition_timeout_ms: 省略则 = kTransitionTimeoutCycles（1s 墙钟）
  strict_init_state: true
  servo_err_poll_cycles: 0      # Run 内不轮询；伺服故障靠 OnGetBuf 的 m_ERRCode==2

# 阻抗/力控（须先下使能 SetControlMode，再 SetEnable 上使能进入该模式）
# 默认值 = SDK DEMO 预设（与 yaml 缺省时 config.hpp 一致）
# 关节: showcase_offline_movl_keepj_execution.cpp
# 笛卡尔/零空间: showcase_offline_movl_execution.cpp（K[6]/D[6] 为零空间）
imp:
  joint:
    # K[7] 关节刚度 N·m/rad（SDK 建议 ≤2）；D[7] 阻尼比 0~1
    K: [2, 2, 2, 1.6, 1, 1, 1]
    D: [0.4, 0.4, 0.4, 0.4, 0.4, 0.4, 0.4]
  cart:
    # K[0~2] 平移 N/m；K[3~5] 旋转 N·m/rad；K[6] 零空间；D 均为阻尼比 0~1
    K: [8000, 8000, 8000, 600, 600, 600, 20]
    D: [0.8, 0.8, 0.8, 0.4, 0.4, 0.4, 1]
    rot_type: 2   # 0 不定义末端旋转；1 自定义；2 自动
  force:
    fx_dir: [0, 0, 1, 0, 0, 0]
    fc_adj_lmt: 10.0

# URDF 模型文件（基座 Link_Base，末端 TCP_Link_L / TCP_Link_R）
# 相对本文件路径，或填写绝对路径。
# test_rt_teleop / 可视化启动时会强制交互选择 615 或 696，覆盖此处路径：
#   696: urdf/Marvin_M6S_CCS_696_ urdf/urdf/Marvin M6-S-CCS-696-V4.0_Base_and_Stand_Asm urdf.urdf
#   615: urdf/Marvin_M3S_CCS_615_urdf/urdf/Marvin_M3-S-CCS-615-V2.0_Base_and_Stand_Asm.urdf
sdk:
  urdf: "/home/yxc/tj_control/urdf/Marvin_M6S_CCS_696_ urdf/urdf/Marvin M6-S-CCS-696-V4.0_Base_and_Stand_Asm urdf.urdf"

left:
  arm_serial: 0
  home_q: [90, -90, -90, 0, 0, 0, 0]
  work_q: [90, -60, -90, -90, 0, 0, 0]
  joint_limit:
    max_v: [30.0, 30.0, 30.0, 30.0, 30.0, 30.0, 30.0]
    max_a: [60.0, 60.0, 60.0, 60.0, 60.0, 60.0, 60.0]
    max_j: [180.0, 180.0, 180.0, 180.0, 180.0, 180.0, 180.0]
  cart_limit:
    max_line_v: 300.0
    max_line_a: 600.0
    max_line_j: 3000.0
    max_angle_v: 57.3
    max_angle_a: 114.6
    max_angle_j: 573.0

right:
  arm_serial: 1
  home_q: [-90, -90, 90,   0, 0, 0, 0]
  work_q: [-90, -60, 90, -90, 0, 0, 0]
  joint_limit:
    max_v: [30.0, 30.0, 30.0, 30.0, 30.0, 30.0, 30.0]
    max_a: [60.0, 60.0, 60.0, 60.0, 60.0, 60.0, 60.0]
    max_j: [180.0, 180.0, 180.0, 180.0, 180.0, 180.0, 180.0]
  cart_limit:
    max_line_v: 300.0
    max_line_a: 600.0
    max_line_j: 3000.0
    max_angle_v: 57.3
    max_angle_a: 114.6
    max_angle_j: 573.0
